{% load static %}
<!DOCTYPE html>
<html>
<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'home' %}">Pooja Portfolio</a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">

        <!-- Separate Pages -->
        <li class="nav-item">
          <a class="nav-link text-warning" href="{% url 'home' %}#home">
            Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-warning" href="{% url 'about' %}#about">
            About
          </a>
        </li>

          </a>
        </li>

          </a>
        </li>

          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-warning" href="{% url 'contact' %}#contact">
            Contact
          </a>
        </li>
        <li class="nav-item" >
           <a class="nav-link text-warning" href="{% static 'files/Poojacv.pdf' %}" download>Download CV</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-5">
  {% block content %}
  {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
